name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-build

      - name: Check the tag matches Main.VERSION
        run: |
          version=$(./build.sh version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in Main.java"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Lint shell scripts
        run: shellcheck -s sh build.sh bin/raito device/raito.sh

      - name: Test and package
        run: ./build.sh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x and suffixed versions (for example 1.0.0-rc1) are published as pre-releases.
          prerelease=
          case "$VERSION" in 0.* | *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag --generate-notes \
            --title "Raito $VERSION" \
            "build/dist/raito-$VERSION.tar.gz" "build/dist/raito-$VERSION.jar" build/dist/SHA256SUMS
